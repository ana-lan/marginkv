# configs/default.yaml
# Shared settings for every experiment. Change only with a decisions-log entry.

seed: 42

datasets: [scifact, nfcorpus]
split: test

paths:                     # relative to the repo root
  data_dir: data
  artifacts_dir: artifacts
  results_dir: results

models:
  qwen3:
    name: Qwen/Qwen3-Reranker-0.6B
    revision: "e61197ed45024b0ed8a2d74b80b4d909f1255473"
  bge:
    name: BAAI/bge-reranker-v2-m3
    revision: "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"

retrieval:
  method: bm25
  pool_size: 100           # BM25 top-k saved as candidates

rerank:
  depth: 20                # rerank top 20, then BM25 ranks 21..100
  max_doc_tokens: 256      # per-model tokenizer truncation
  batch_size: 8

eval:
  cutoff: 10               # nDCG@10, MRR@10
  recall_cutoff: 100       # Recall@100 diagnostic

runtime:
  device: auto             # auto | mps | cpu | cuda
  dtype: bfloat16          # bfloat16 | float16 | float32

lora:                      # Phase 4: identical for the doc-first arm and the query-first control
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  lr: 0.0001
  weight_decay: 0.0
  warmup_frac: 0.05
  epochs: 1
  group_size: 8            # 1 positive + 7 negatives (matches the 4.1 artifact)
  groups_per_step: 8       # 64 sequences per optimizer step
  micro_groups: 4          # groups per forward pass on the L4; use --micro-groups 1 on the Mac
  max_grad_norm: 1.0
  temperature: 1.0
  dev_every: 300